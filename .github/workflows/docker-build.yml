name: Build and Push Images on Release

# 触发方式：
# 1) 在 GitHub 网页 Releases 页面「Create a new release」并发布（tag 直接填版本号，例如 1.4.4，不带 v）
# 2) 手动触发（Actions 页面 -> Run workflow），需要填入一个已存在的 Release tag
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 Release tag（例如 1.4.4），该 tag 对应的 Release 需已存在"
        required: true
        type: string

permissions:
  contents: read

# 同一个 tag 同一时间只允许一个构建在跑，重复触发时排队而不是并行覆盖
concurrency:
  group: build-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve-version:
    name: Resolve Version from Release Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version from release tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            echo "手动触发，使用指定的 tag: $TAG"
          else
            TAG="$RELEASE_TAG"
            echo "Release 发布触发，tag: $TAG"
          fi

          # tag 会用作镜像 tag 和 Release 定位，只允许常见版本号字符，避免异常输入
          if ! [[ "$TAG" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "非法的 tag: $TAG"
            exit 1
          fi

          # tag 本身就是版本号（不带 v 前缀），直接用作 Docker 镜像 tag
          VERSION="$TAG"
          echo "Docker image version: $VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-gost:
    name: Build & Upload GOST Binary (${{ matrix.arch }})
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go-gost/go.mod

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install UPX
        run: |
          wget https://github.com/upx/upx/releases/download/v4.2.1/upx-4.2.1-amd64_linux.tar.xz
          tar -xf upx-4.2.1-amd64_linux.tar.xz
          sudo mv upx-4.2.1-amd64_linux/upx /usr/local/bin/
          rm -rf upx-4.2.1-amd64_linux*

      - name: Build GOST binary
        working-directory: ./go-gost
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -ldflags="-s -w" -o gost-${{ matrix.arch }}

      - name: Compress with UPX
        working-directory: ./go-gost
        run: |
          upx --best --lzma gost-${{ matrix.arch }}

      - name: Package offline deployment bundle
        run: |
          mkdir -p ./offline-${{ matrix.arch }}
          cp ./go-gost/gost-${{ matrix.arch }} ./offline-${{ matrix.arch }}/gost
          cp ./offline.sh ./offline-${{ matrix.arch }}/offline.sh
          chmod +x ./offline-${{ matrix.arch }}/gost ./offline-${{ matrix.arch }}/offline.sh
          (cd ./offline-${{ matrix.arch }} && zip -j ../flux-panel-offline-${{ matrix.arch }}.zip gost offline.sh)

      - name: Upload GOST binary to the Release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./go-gost/gost-${{ matrix.arch }}
          tag: ${{ needs.resolve-version.outputs.tag }}
          overwrite: true

      - name: Upload offline bundle to the Release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./flux-panel-offline-${{ matrix.arch }}.zip
          tag: ${{ needs.resolve-version.outputs.tag }}
          overwrite: true

      - name: Upload node install scripts to the Release
        if: matrix.arch == 'amd64'
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: |
            ./install.sh
            ./offline.sh
          tag: ${{ needs.resolve-version.outputs.tag }}
          overwrite: true

  build-vite:
    name: Build & Push Vite Frontend
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Vite Docker images
        env:
          DOCKER_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t ${DOCKER_USER}/vite-frontend:latest \
            -t ${DOCKER_USER}/vite-frontend:${VERSION} \
            ./vite-frontend

  build-java:
    name: Build & Push Spring Boot Backend
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Set up JDK and Maven
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build Java JAR
        working-directory: ./springboot-backend
        run: mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Java Docker images
        env:
          DOCKER_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t ${DOCKER_USER}/springboot-backend:latest \
            -t ${DOCKER_USER}/springboot-backend:${VERSION} \
            ./springboot-backend

      - name: Upload panel scripts and config to the Release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: |
            ./panel_install.sh
            ./docker-compose-v4.yml
            ./docker-compose-v6.yml
            ./database/install.sql
            ./database/update.sql
          tag: ${{ needs.resolve-version.outputs.tag }}
          overwrite: true
