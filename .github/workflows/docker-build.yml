name: Build and Push Images on Release

# 触发方式：
# 1) 在 GitHub 网页 Releases 页面「Create a new release」并发布（tag 直接填版本号，例如 1.4.4，不带 v）
# 2) 手动触发（Actions 页面 -> Run workflow），需要填入一个已存在的 Release tag
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 Release tag（例如 1.4.4），该 tag 对应的 Release 需已存在"
        required: true
        type: string

permissions:
  contents: read

# tag 本身就是版本号（不带 v 前缀）：Release 发布触发取 Release 的 tag，手动触发取输入的 tag；
# 同时用作 Docker 镜像 tag 和 Release 附件的定位。脚本里一律通过 $TAG 引用，不把外部输入直接拼进 shell
env:
  TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

# 同一个 tag 同一时间只允许一个构建在跑，重复触发时排队而不是并行覆盖
concurrency:
  group: build-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  build-gost:
    name: Build & Upload GOST Binary (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go-gost/go.mod

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install UPX
        run: |
          wget https://github.com/upx/upx/releases/download/v4.2.1/upx-4.2.1-amd64_linux.tar.xz
          tar -xf upx-4.2.1-amd64_linux.tar.xz
          sudo mv upx-4.2.1-amd64_linux/upx /usr/local/bin/
          rm -rf upx-4.2.1-amd64_linux*

      - name: Build GOST binary
        working-directory: ./go-gost
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -ldflags="-s -w" -o gost-${{ matrix.arch }}

      - name: Compress with UPX
        working-directory: ./go-gost
        run: |
          upx --best --lzma gost-${{ matrix.arch }}

      - name: Package offline deployment bundle
        run: |
          mkdir -p ./offline-${{ matrix.arch }}
          cp ./go-gost/gost-${{ matrix.arch }} ./offline-${{ matrix.arch }}/gost
          cp ./offline.sh ./offline-${{ matrix.arch }}/offline.sh
          chmod +x ./offline-${{ matrix.arch }}/gost ./offline-${{ matrix.arch }}/offline.sh
          (cd ./offline-${{ matrix.arch }} && zip -j ../flux-panel-offline-${{ matrix.arch }}.zip gost offline.sh)

      - name: Upload GOST binary to the Release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./go-gost/gost-${{ matrix.arch }}
          tag: ${{ env.TAG }}
          overwrite: true

      - name: Upload offline bundle to the Release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./flux-panel-offline-${{ matrix.arch }}.zip
          tag: ${{ env.TAG }}
          overwrite: true

  # 校验链：面板命令校验 install.sh，install.sh 校验节点程序。要等两个架构的程序都上传后才能算出校验值
  publish-node-scripts:
    name: Publish Node Install Scripts
    needs: build-gost
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      install_sha256: ${{ steps.pin.outputs.install_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Write release version and checksums into install.sh
        id: pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "tag 格式不支持: $TAG"; exit 1; }
          mkdir -p ./release-node-scripts ./release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --clobber -D ./release-assets -p 'gost-amd64' -p 'gost-arm64'
          AMD64_SHA=$(sha256sum ./release-assets/gost-amd64 | awk '{print $1}')
          ARM64_SHA=$(sha256sum ./release-assets/gost-arm64 | awk '{print $1}')
          sed -e "s/__RELEASE_TAG__/$TAG/" -e "s/__GOST_SHA256_AMD64__/$AMD64_SHA/" -e "s/__GOST_SHA256_ARM64__/$ARM64_SHA/" \
            ./install.sh > ./release-node-scripts/install.sh
          if grep -q '__RELEASE_TAG__\|__GOST_SHA256_' ./release-node-scripts/install.sh; then
            echo "install.sh 里还有没替换的占位符"
            exit 1
          fi
          cp ./offline.sh ./release-node-scripts/
          echo "install_sha256=$(sha256sum ./release-node-scripts/install.sh | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload node install scripts to the Release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: ./release-node-scripts/*
          tag: ${{ env.TAG }}
          overwrite: true

  build-vite:
    name: Build & Push Vite Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Vite Docker images
        env:
          DOCKER_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
        run: |
          VERSION="$TAG"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t ${DOCKER_USER}/vite-frontend:latest \
            -t ${DOCKER_USER}/vite-frontend:${VERSION} \
            ./vite-frontend

  build-java:
    name: Build & Push Spring Boot Backend
    needs: publish-node-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up JDK and Maven
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build Java JAR
        working-directory: ./springboot-backend
        run: mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Java Docker images
        env:
          DOCKER_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          NODE_INSTALL_SHA256: ${{ needs.publish-node-scripts.outputs.install_sha256 }}
        run: |
          VERSION="$TAG"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --build-arg RELEASE_TAG="$TAG" \
            --build-arg NODE_INSTALL_SHA256="$NODE_INSTALL_SHA256" \
            -t ${DOCKER_USER}/springboot-backend:latest \
            -t ${DOCKER_USER}/springboot-backend:${VERSION} \
            ./springboot-backend

      - name: Collect panel scripts and config
        run: |
          mkdir -p ./release-panel-files
          cp ./panel_install.sh ./docker-compose-v4.yml ./docker-compose-v6.yml ./release-panel-files/
          cp ./database/install.sql ./database/update.sql ./release-panel-files/

      - name: Upload panel scripts and config to the Release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: ./release-panel-files/*
          tag: ${{ env.TAG }}
          overwrite: true
